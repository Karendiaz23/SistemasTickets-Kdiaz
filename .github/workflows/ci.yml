name: CI/CD - Build, Push GHCR and Deploy SSH

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies and verify syntax
        run: |
          npm ci
          node --check index.js

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/karendiaz23/sistemastickets-kdiaz-app
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy on VM
        run: |
          set -e
          cd ~/SistemasTickets-Kdiaz
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="ghcr.io/karendiaz23/sistemastickets-kdiaz-app:sha-${SHORT_SHA}"

          docker pull "$IMAGE_TAG"
          docker tag "$IMAGE_TAG" sistemastickets-kdiaz-app-tickets
          docker compose up -d --force-recreate app-tickets
          docker compose ps

          sleep 3
          curl -fsS http://localhost:3001 >/dev/null
          curl -fsS http://localhost:8091/api/health >/dev/null
          echo "Deploy OK -> ${IMAGE_TAG}"
